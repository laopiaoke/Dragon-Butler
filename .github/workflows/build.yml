name: build

# 三条触发线：
#   push main / PR  → 只跑验收（构建 + 依赖审计 + 集成探针），保证"提交即可信"
#   push tag v*     → 验收通过后自动打包两个变体并发 Release
#   手动 dispatch   → 只打包不上传 Release（干跑，产物存在 Artifacts 里）
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # 发版跑到一半不能被新提交取消；平时的构建可以
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: 构建与验收
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: 检出
        uses: actions/checkout@v7

      # 曾经踩过：图标被 LFS 接管，CI 检出后是指针文本，csc 报 CS7065。把这件事变成断言
      - name: 构建输入必须是真实字节（不是 LFS 指针）
        shell: pwsh
        run: |
          $bad = @(Get-ChildItem -Path "Dragon Butler" -Recurse -Include *.ico,*.png,*.bmp,*.jpg |
                   Where-Object { $_.Length -lt 200 -and (Get-Content $_.FullName -TotalCount 1) -match 'git-lfs\.github\.com/spec' })
          if ($bad.Count -gt 0) {
              $bad | ForEach-Object { "  指针：$($_.FullName)（$($_.Length) 字节）" }
              throw "构建输入被 LFS 接管了：检出后只剩指针文本，csc 编不进 Win32 资源"
          }
          Write-Host "OK · 图标等构建输入是真实字节"

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # 这条是给未来的自己看的：本项目的"克制"是可执行的规则，不是口头约定
      - name: 依赖审计（零 NuGet / 零前端产物）
        shell: pwsh
        run: |
          $refs = @(Get-ChildItem -Path . -Recurse -Filter *.csproj | Select-String -Pattern '<PackageReference')
          if ($refs.Count -gt 0) {
              $refs | ForEach-Object { "  $($_.Path):$($_.LineNumber)" }
              throw "发现 $($refs.Count) 处 PackageReference：本项目约定零第三方依赖"
          }
          $frontNames = @('package.json', 'package-lock.json', 'yarn.lock', 'pnpm-lock.yaml')
          $front = @(Get-ChildItem -Path . -Recurse -File | Where-Object { $frontNames -contains $_.Name })
          if ($front.Count -gt 0) {
              throw "发现前端产物：$($front[0].FullName)"
          }
          Write-Host "OK · 0 个 PackageReference，0 个前端产物"

      - name: 构建（0 警告是硬门槛）
        shell: pwsh
        run: |
          dotnet build "Dragon Butler\Dragon Butler.csproj" -c Release -p:EnableNETAnalyzers=true -warnaserror
          if ($LASTEXITCODE -ne 0) { throw "构建失败，退出码 $LASTEXITCODE" }

      # 用 StubTool 驱动 RunCoordinator，验证"日志命中完成判定"这条主链路真的通
      - name: 集成探针（StubTool · 日志完成判定）
        shell: pwsh
        run: |
          dotnet build "tests\StubTool\StubTool.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { throw "StubTool 构建失败" }
          dotnet build "tests\CoordinatorProbe\CoordinatorProbe.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { throw "CoordinatorProbe 构建失败" }

          $stub  = (Get-ChildItem "tests\StubTool\bin\Release" -Recurse -Filter StubTool.exe | Select-Object -First 1).FullName
          $probe = (Get-ChildItem "tests\CoordinatorProbe\bin\Release" -Recurse -Filter CoordinatorProbe.exe | Select-Object -First 1).FullName
          Write-Host "stub  = $stub"
          Write-Host "probe = $probe"
          & $probe logpattern $stub
          if ($LASTEXITCODE -ne 0) { throw "探针失败：依赖日志的完成判定没有触发" }

      # tag 与 csproj 版本必须对得上，否则包名、Release 名、程序内版本号会三方打架
      - name: 版本号与 tag 一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          # 预发布写法形如 v1.5.2-rc1：比版本号时只比 - 之前的部分
          $base = $tag
          if ($base -match '^(.+?)-') { $base = $matches[1] }
          $node = ([xml](Get-Content "Dragon Butler\Dragon Butler.csproj" -Raw)).SelectSingleNode('//*[local-name()="Version"]')
          if ($null -eq $node) { throw "csproj 里没有 <Version>" }
          $ver = $node.InnerText.Trim()
          $parts = $ver.Split('.')
          if ($parts.Count -ge 3 -and $parts[-1] -eq '0') { $parts = $parts[0..($parts.Count - 2)] }
          $expect = 'v' + ($parts -join '.')
          if ($expect -ne $base) { throw "版本对不上：tag 是 $tag（基准 $base），csproj 是 $ver（对应 $expect）" }
          Write-Host "OK · tag $tag 与 csproj $ver 一致"

  release:
    name: 打包与发布
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: 打包两个变体
        shell: pwsh
        run: |
          # 本地策略可能是 Restricted，进程级放开，别让脚本被拦
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force -ErrorAction SilentlyContinue
          ./scripts/package.ps1 -Variant all

      - name: 校验产物并记 SHA256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "发布\*.zip")
          if ($files.Count -ne 2) { throw "应产出 2 个 zip，实际 $($files.Count)" }
          foreach ($f in $files) {
              $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
              $mb = '{0:N2}' -f ($f.Length / 1MB)
              Write-Host "$($f.Name)  $mb MB  sha256=$hash"
              "$hash  $($f.Name)" | Out-File -FilePath "发布\SHA256SUMS.txt" -Append -Encoding ascii
          }

      - name: 保存产物（7 天）
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            发布/*.zip
            发布/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error

      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = Join-Path $env:RUNNER_TEMP "notes-$tag.md"

          # 发布说明来自 RELEASE_NOTES.md 的同名小节，不另写一份
          ./scripts/release-notes.ps1 -Version $tag -Out $notes
          $title = (./scripts/release-notes.ps1 -Version $tag -TitleOnly).Trim()

          $zips = @(Get-ChildItem "发布\*.zip")
          $portable = ($zips | Where-Object { $_.Name -like '*portable*' }).FullName
          $dep      = ($zips | Where-Object { $_.Name -like '*runtime-dependent*' }).FullName
          $ghArgs = @('release', 'create', $tag, '--title', $title, '--notes-file', $notes)
          if ($tag -like '*-*') { $ghArgs += '--prerelease' } else { $ghArgs += '--latest' }

          # 变量特意不叫 $args：那是 PowerShell 的自动变量，在脚本作用域里赋值可能被静默忽略
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { Write-Host "Release 可能已存在，改为覆盖资产" }

          gh release upload $tag "$portable#免安装便携版（自带运行时，推荐）" "$dep#需 .NET 8 运行时" --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传 Release 资产失败" }
          Write-Host "已发布：https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
